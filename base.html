<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Library</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 a { color: inherit; text-decoration: none; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
    th, td { border: 1px solid #ccc; padding: .45rem .6rem; text-align: left; vertical-align: middle; }
    th { background: #f0f0f0; }
    img.thumb { height: 56px; border-radius: 4px; }
    .btn { display: inline-block; padding: .3rem .7rem; border: 1px solid #555; border-radius: 4px;
           background: #fff; color: #222; text-decoration: none; cursor: pointer; font-size: .9rem; }
    .btn.danger { border-color: #b00020; color: #b00020; }
    .flash { background: #fff3cd; border: 1px solid #e0c36a; padding: .5rem .8rem; margin-bottom: 1rem; border-radius: 4px; }
    label { display: block; margin-top: .8rem; font-weight: 600; }
    input, select { padding: .4rem; width: 100%; max-width: 380px; box-sizing: border-box; }
    form.inline { display: inline; }
  </style>
</head>
<body>
  <h1><a href="{{ url_for('index') }}">📚 Library</a></h1>
  {% with msgs = get_flashed_messages() %}
    {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
